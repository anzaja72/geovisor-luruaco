# ============================================================
# Despliegue en VPS Hostinger (Traefik + Let's Encrypt ya presentes).
# El frontend se enruta por Traefik (TLS automático); PostGIS y backend
# quedan en la red interna, sin exponer puertos públicos.
#   docker compose -f docker-compose.vps.yml up -d --build
# Requiere .env con: DB_PASSWORD, JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD
# ============================================================
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: geodb-postgis
    environment:
      POSTGRES_USER: eco_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD}
      POSTGRES_DB: restauracion_ecologica
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eco_admin -d restauracion_ecologica"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build: ./02-backend
    container_name: geodb-backend
    environment:
      DB_HOST: postgis
      DB_PORT: "5432"
      DB_USER: eco_admin
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: restauracion_ecologica
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?definir JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@luruaco.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?definir ADMIN_PASSWORD}
      CORS_ALLOW_ORIGINS: https://geodatabase.mcconsultorias.com.co
      PORT: "8080"
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./03-frontend
      args:
        VITE_API_URL: ""
    container_name: geodb-frontend
    volumes:
      - ./tiles:/usr/share/nginx/tiles:ro
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.geodb.rule=Host(`geodatabase.mcconsultorias.com.co`)"
      - "traefik.http.routers.geodb.entrypoints=websecure"
      - "traefik.http.routers.geodb.tls.certresolver=letsencrypt"
      - "traefik.http.services.geodb.loadbalancer.server.port=80"

volumes:
  postgis_data:
