# Nginx del contenedor frontend: SPA + proxy del API al backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad. Van a nivel de servidor, así que valen también para /api.
    # (nginx no las hereda en una location que declare su propio add_header: /tiles/
    # solo sirve imágenes y no las necesita.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # TLS lo termina Traefik; el navegador solo acepta HSTS cuando llega por HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # El geovisor puede incrustarse en el sitio de la C.R.A., y en ningún otro.
    add_header Content-Security-Policy "frame-ancestors 'self' https://crautonoma.gov.co https://*.crautonoma.gov.co" always;

    # API → backend (red interna de docker-compose)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;   # importación de archivos
    }
    location /health {
        proxy_pass http://backend:8080/health;
    }

    # Tiles de la ortofoto (estáticos generados con gdal2tiles)
    location /tiles/ {
        alias /usr/share/nginx/tiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: rutas del cliente → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
