# Nginx del contenedor frontend: SPA + proxy del API al backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → backend (red interna de docker-compose)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;   # importación de archivos
    }
    location /health {
        proxy_pass http://backend:8080/health;
    }

    # Tiles de la ortofoto (estáticos generados con gdal2tiles)
    location /tiles/ {
        alias /usr/share/nginx/tiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: rutas del cliente → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
