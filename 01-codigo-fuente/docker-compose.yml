version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis-eco-restauracion
    environment:
      POSTGRES_USER: eco_admin
      POSTGRES_PASSWORD: EcoRest2024!
      POSTGRES_DB: restauracion_ecologica
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eco_admin -d restauracion_ecologica"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
    driver: local